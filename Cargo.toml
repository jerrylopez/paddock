[package]
name = "paddock"
version = "0.3.0"
edition = "2024"
description = "Native environment setup for Amp orbs"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[features]
# Builds the Docker-based container tests. Run them with `cargo container-tests`.
container-tests = []

[[test]]
name = "container"
required-features = ["container-tests"]

[profile.release]
lto = true
codegen-units = 1
strip = true
