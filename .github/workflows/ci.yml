name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full CI before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  container-modules:
    name: List container test modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
      # One module per service in tests/container; each gets its own job below.
      - id: list
        run: |
          modules=$(find tests/container -maxdepth 1 -name '*.rs' ! -name main.rs ! -name harness.rs \
            -exec basename {} .rs \; | sort | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  container:
    name: Container tests (${{ matrix.module }})
    needs: container-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.container-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo container-tests --locked -- '${{ matrix.module }}::'
